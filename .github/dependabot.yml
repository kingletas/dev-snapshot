version: 2

updates:
  # Every action is pinned to a commit SHA. Dependabot reads the `# vX.Y.Z`
  # comment beside each one and opens a pull request that moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
